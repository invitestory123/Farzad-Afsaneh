<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1614"/>
      <stop offset="45%" stop-color="#1e0f0e"/>
      <stop offset="100%" stop-color="#140908"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#947132"/>
      <stop offset="25%" stop-color="#e5ce92"/>
      <stop offset="50%" stop-color="#fff2ce"/>
      <stop offset="75%" stop-color="#d4b060"/>
      <stop offset="100%" stop-color="#805d25"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fdf4db" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#d4b060" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#140908" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1200" fill="url(#bgGrad)"/>
  <circle cx="500" cy="500" r="450" fill="url(#centerGlow)"/>

  <!-- Outer Double Border -->
  <rect x="35" y="35" width="930" height="1130" rx="28" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.65"/>
  <rect x="55" y="55" width="890" height="1090" rx="20" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.4"/>

  <!-- Corner Flourishes -->
  <!-- Top Left -->
  <path d="M55,140 Q55,55 140,55 M75,130 Q75,75 130,75 M60,60 L100,100" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
  <circle cx="100" cy="100" r="3.5" fill="url(#gold)"/>
  <!-- Top Right -->
  <path d="M945,140 Q945,55 860,55 M925,130 Q925,75 870,75 M940,60 L900,100" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
  <circle cx="900" cy="100" r="3.5" fill="url(#gold)"/>
  <!-- Bottom Left -->
  <path d="M55,1060 Q55,1145 140,1145 M75,1070 Q75,1125 130,1125 M60,1140 L100,1100" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
  <circle cx="100" cy="1100" r="3.5" fill="url(#gold)"/>
  <!-- Bottom Right -->
  <path d="M945,1060 Q945,1145 860,1145 M925,1070 Q925,1125 870,1125 M940,1140 L900,1100" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
  <circle cx="900" cy="1100" r="3.5" fill="url(#gold)"/>

  <!-- Ornate Arch / Mihrab Frame -->
  <path d="M 160,1050 L 160,520 Q 160,260 500,180 Q 840,260 840,520 L 840,1050 Z" 
        fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.75"/>
  <path d="M 180,1030 L 180,530 Q 180,285 500,210 Q 820,285 820,530 L 820,1030 Z" 
        fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.45"/>

  <!-- Top Crown Ornament -->
  <g transform="translate(500, 160)">
    <path d="M 0,-30 Q 15,-10 35,-5 Q 15,10 0,30 Q -15,10 -35,-5 Q -15,-10 0,-30 Z" fill="url(#gold)" opacity="0.85"/>
    <circle cx="0" cy="-35" r="4" fill="url(#gold)"/>
    <circle cx="-50" cy="0" r="3" fill="url(#gold)"/>
    <circle cx="50" cy="0" r="3" fill="url(#gold)"/>
    <line x1="-150" y1="20" x2="-60" y2="20" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>
    <line x1="60" y1="20" x2="150" y2="20" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Central Medallion Circle -->
  <circle cx="500" cy="460" r="160" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.85"/>
  <circle cx="500" cy="460" r="172" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="4,6" opacity="0.6"/>
  <circle cx="500" cy="460" r="148" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>

  <!-- Interlocking Rings / Monogram Motif in Medallion -->
  <g transform="translate(500, 460)">
    <!-- Intertwined Rings -->
    <ellipse cx="-25" cy="-20" rx="48" ry="48" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.7"/>
    <ellipse cx="25" cy="-20" rx="48" ry="48" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.7"/>
    <!-- Sparkle Diamond -->
    <path d="M 0,-68 L 7,-55 L 0,-42 L -7,-55 Z" fill="#fff9eb" filter="url(#glow)"/>
    
    <!-- Monogram Letters A & F -->
    <text x="0" y="45" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="88" font-style="italic" font-weight="600" text-anchor="middle" fill="url(#gold)" filter="url(#glow)">A &amp; F</text>
  </g>

  <!-- Elegant Decorative Scroll / Divider Below Medallion -->
  <g transform="translate(500, 680)" opacity="0.7">
    <line x1="-180" y1="0" x2="-40" y2="0" stroke="url(#gold)" stroke-width="1"/>
    <line x1="40" y1="0" x2="180" y2="0" stroke="url(#gold)" stroke-width="1"/>
    <path d="M 0,-8 L 8,0 L 0,8 L -8,0 Z" fill="url(#gold)"/>
    <circle cx="-180" cy="0" r="2.5" fill="url(#gold)"/>
    <circle cx="180" cy="0" r="2.5" fill="url(#gold)"/>
  </g>
</svg>
